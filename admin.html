<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beirute — Panel Administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --teal: #2BBFB3;
  --teal-dark: #1a9990;
  --black: #0d0f11;
  --dark: #13161a;
  --mid: #1e2228;
  --card: #181c21;
  --border: #252b33;
  --text: #eef0f3;
  --muted: #8c9099;
  --dim: #4a5260;
  --danger: #e05252;
  --success: #2BBFB3;
  --warn: #f0a030;
}
body { font-family: 'Barlow', sans-serif; background: var(--black); color: var(--text); min-height: 100vh; }

/* LOGIN */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--black);
  background-image: radial-gradient(ellipse at 20% 50%, rgba(43,191,179,0.06) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 20%, rgba(43,191,179,0.04) 0%, transparent 50%);
}
.login-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2.5rem;
  width: 360px;
  max-width: 95vw;
}
.login-logo {
  text-align: center;
  margin-bottom: 2rem;
}
.login-logo .brand-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--teal);
}
.login-logo .brand-sub {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--dim);
  margin-top: 4px;
}
.login-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
  display: block;
}
.login-input {
  width: 100%;
  padding: 11px 14px;
  background: var(--mid);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  font-size: 14px;
  font-family: 'Barlow', sans-serif;
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 1rem;
}
.login-input:focus { border-color: var(--teal); }
.login-btn {
  width: 100%;
  padding: 12px;
  background: var(--teal);
  color: var(--black);
  border: none;
  border-radius: 7px;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s;
}
.login-btn:hover { background: var(--teal-dark); }
.login-error {
  color: var(--danger);
  font-size: 12px;
  margin-top: 8px;
  text-align: center;
  display: none;
}

/* ADMIN PANEL */
#adminPanel { display: none; }

.top-bar {
  background: var(--dark);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.top-brand {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.top-brand span { color: var(--teal); }
.top-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  padding: 7px 16px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-teal { background: var(--teal); color: var(--black); }
.btn-teal:hover { background: var(--teal-dark); }
.btn-outline { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-outline:hover { color: var(--text); border-color: var(--muted); }
.btn-danger { background: rgba(224,82,82,0.12); color: var(--danger); border: 1px solid rgba(224,82,82,0.2); }
.btn-danger:hover { background: rgba(224,82,82,0.22); }

.main { padding: 1.5rem 2rem; max-width: 1500px; margin: 0 auto; }

/* STATS */
.stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 1.5rem; }
@media(max-width:768px){ .stats{grid-template-columns:repeat(2,1fr);} }
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.1rem 1.25rem;
  position: relative;
  overflow: hidden;
}
.stat::before { content:''; position:absolute; top:0;left:0;right:0;height:2px;background:var(--teal); }
.stat-val { font-family:'Barlow Condensed',sans-serif; font-size:34px; font-weight:700; color:#fff; line-height:1; }
.stat-lbl { font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:4px; }

/* FILTERS */
.filters {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.25rem;
  margin-bottom: 1.5rem;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: flex-end;
}
.filter-group { display: flex; flex-direction: column; gap: 4px; }
.filter-label { font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim); }
.filter-select, .filter-input {
  padding: 7px 12px;
  background: var(--mid);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  font-family: 'Barlow', sans-serif;
  outline: none;
  transition: border-color 0.15s;
  min-width: 130px;
}
.filter-select:focus, .filter-input:focus { border-color: var(--teal); }

/* TABLE */
.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.table-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .85rem 1.25rem;
  border-bottom: 1px solid var(--border);
  background: var(--dark);
}
.table-title { font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase; }
.record-count { font-size:12px;color:var(--muted); }
.tbl-scroll { overflow-x: auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th {
  text-align:left; padding:9px 12px;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim); background:var(--dark); border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td { padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover td { background:rgba(43,191,179,0.03); }
.del-btn {
  background:none; border:none; cursor:pointer;
  color:var(--dim); font-size:15px; padding:4px 6px;
  border-radius:4px; transition:color .15s, background .15s;
}
.del-btn:hover { color:var(--danger); background:rgba(224,82,82,.1); }
.badge {
  display:inline-flex; align-items:center;
  padding:2px 9px; border-radius:3px;
  font-size:11px;font-weight:600;letter-spacing:.04em;
  font-family:'Barlow Condensed',sans-serif;
}
.badge-teal { background:rgba(43,191,179,.12);color:var(--teal);border:1px solid rgba(43,191,179,.25); }
.hours-chip { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:var(--teal); }
.empty { text-align:center;padding:3rem;color:var(--dim);font-size:14px; }

/* LOADING */
.loading { text-align:center;padding:3rem;color:var(--muted);font-size:14px; }
.spinner {
  width:28px;height:28px;border:3px solid var(--border);
  border-top-color:var(--teal);border-radius:50%;
  animation:spin .7s linear infinite;margin:0 auto 10px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast {
  position:fixed;bottom:24px;right:24px;
  background:var(--teal);color:var(--black);
  padding:10px 20px;border-radius:6px;
  font-size:13px;font-weight:600;
  display:none;z-index:999;
  font-family:'Barlow Condensed',sans-serif;
  letter-spacing:.04em;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="brand-name">Beirute</div>
      <div class="brand-sub">Panel de Administrador</div>
    </div>
    <label class="login-label">Contraseña</label>
    <input type="password" class="login-input" id="passInput" placeholder="Ingresa la contraseña" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="loginError">Contraseña incorrecta</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <div class="top-bar">
    <div class="top-brand"><span>Beirute</span> — Administrador</div>
    <div class="top-actions">
      <button class="btn btn-teal" onclick="exportExcel()">⬇ Exportar Excel</button>
      <button class="btn btn-outline" onclick="logout()">Salir</button>
    </div>
  </div>

  <div class="main">
    <!-- STATS -->
    <div class="stats">
      <div class="stat"><div class="stat-val" id="sRegistros">—</div><div class="stat-lbl">Registros</div></div>
      <div class="stat"><div class="stat-val" id="sHoras">—</div><div class="stat-lbl">Horas totales</div></div>
      <div class="stat"><div class="stat-val" id="sTecnicos">—</div><div class="stat-lbl">Técnicos</div></div>
      <div class="stat"><div class="stat-val" id="sClientes">—</div><div class="stat-lbl">Clientes</div></div>
    </div>

    <!-- FILTERS -->
    <div class="filters">
      <div class="filter-group">
        <span class="filter-label">Mes</span>
        <select class="filter-select" id="fMes" onchange="applyFilters()">
          <option value="">Todos</option>
          <option>Enero</option><option>Febrero</option><option>Marzo</option>
          <option>Abril</option><option>Mayo</option><option>Junio</option>
          <option>Julio</option><option>Agosto</option><option>Septiembre</option>
          <option>Octubre</option><option>Noviembre</option><option>Diciembre</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Técnico</span>
        <select class="filter-select" id="fTecnico" onchange="applyFilters()">
          <option value="">Todos</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Cliente</span>
        <select class="filter-select" id="fCliente" onchange="applyFilters()">
          <option value="">Todos</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Buscar</span>
        <input type="text" class="filter-input" id="fBuscar" placeholder="Nombre, trabajo..." oninput="applyFilters()">
      </div>
      <div class="filter-group" style="justify-content:flex-end">
        <button class="btn btn-outline" onclick="clearFilters()">Limpiar</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
      <div class="table-head">
        <span class="table-title">Registros de horas</span>
        <span class="record-count" id="recordCount">Cargando...</span>
      </div>
      <div class="tbl-scroll">
        <div class="loading" id="loadingMsg">
          <div class="spinner"></div>
          Conectando con Firebase...
        </div>
        <table id="mainTable" style="display:none">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Día</th>
              <th>Técnico</th>
              <th>Entrada</th>
              <th>Salida</th>
              <th>Horas</th>
              <th>Cliente</th>
              <th>Trabajo realizado</th>
              <th>Fase</th>
              <th>Centro</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDqaeqqE81-AhUcmaUJgKHj_laavqTiqcQ",
    authDomain: "registro-de-horas-extras.firebaseapp.com",
    databaseURL: "https://registro-de-horas-extras-default-rtdb.firebaseio.com",
    projectId: "registro-de-horas-extras",
    storageBucket: "registro-de-horas-extras.firebasestorage.app",
    messagingSenderId: "437524860535",
    appId: "1:437524860535:web:b17376b26b3eb10db70072"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const recordsRef = ref(db, 'registros');

  onValue(recordsRef, (snapshot) => {
    window.allRecords = [];
    snapshot.forEach((child) => {
      window.allRecords.push({ _key: child.key, ...child.val() });
    });
    window.allRecords.sort((a,b) => (a.fecha||'').localeCompare(b.fecha||''));
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('mainTable').style.display = 'table';
    populateFilters();
    applyFilters();
  });

  window.deleteFromFirebase = function(key) {
    remove(ref(db, 'registros/' + key));
  };
</script>

<script>
const PASS = "beirute2024"; // ← Cambia esta contraseña
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

window.allRecords = [];

function doLogin() {
  const val = document.getElementById('passInput').value;
  if(val === PASS) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    document.getElementById('loginError').style.display = 'none';
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('passInput').value = '';
  }
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('adminPanel').style.display = 'none';
  document.getElementById('passInput').value = '';
}

function parseTime(t) { if(!t) return 0; const [h,m] = t.split(':').map(Number); return h*60+m; }
function diffH(a,b) { if(!a||!b) return 0; return Math.max(0,(parseTime(b)-parseTime(a))/60); }

function populateFilters() {
  const tecnicos = [...new Set(window.allRecords.map(r=>r.empleado).filter(Boolean))].sort();
  const clientes = [...new Set(window.allRecords.map(r=>r.cliente).filter(Boolean))].sort();
  const fT = document.getElementById('fTecnico');
  const fC = document.getElementById('fCliente');
  const prevT = fT.value, prevC = fC.value;
  fT.innerHTML = '<option value="">Todos</option>' + tecnicos.map(t=>`<option ${t===prevT?'selected':''}>${t}</option>`).join('');
  fC.innerHTML = '<option value="">Todos</option>' + clientes.map(c=>`<option ${c===prevC?'selected':''}>${c}</option>`).join('');
}

function applyFilters() {
  const mes = document.getElementById('fMes').value;
  const tec = document.getElementById('fTecnico').value;
  const cli = document.getElementById('fCliente').value;
  const bus = document.getElementById('fBuscar').value.toLowerCase();

  let filtered = window.allRecords.filter(r => {
    if(mes) {
      const d = new Date((r.fecha||'') + 'T12:00:00');
      if(MESES[d.getMonth()] !== mes) return false;
    }
    if(tec && r.empleado !== tec) return false;
    if(cli && r.cliente !== cli) return false;
    if(bus) {
      const haystack = [r.empleado,r.cliente,r.trabajo,r.fase,r.centro].join(' ').toLowerCase();
      if(!haystack.includes(bus)) return false;
    }
    return true;
  });

  renderTable(filtered);
  updateStats(filtered);
}

function renderTable(rows) {
  const tbody = document.getElementById('tableBody');
  document.getElementById('recordCount').textContent = rows.length + ' registros';
  if(rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11"><div class="empty">No hay registros con estos filtros</div></td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const d = new Date((r.fecha||'') + 'T12:00:00');
    const dia = isNaN(d) ? '—' : DIAS[d.getDay()];
    const fecha = isNaN(d) ? r.fecha||'—' : `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
    const h = diffH(r.entrada, r.salida);
    return `<tr>
      <td style="white-space:nowrap;font-family:'Barlow Condensed',sans-serif">${fecha}</td>
      <td style="color:var(--muted);font-size:12px;text-transform:capitalize">${dia}</td>
      <td style="font-weight:500">${r.empleado||'—'}</td>
      <td style="font-family:'Barlow Condensed',sans-serif">${r.entrada||'—'}</td>
      <td style="font-family:'Barlow Condensed',sans-serif">${r.salida||'—'}</td>
      <td><span class="hours-chip">${h>0?h.toFixed(1)+'h':'—'}</span></td>
      <td>${r.cliente||'—'}</td>
      <td style="color:var(--muted);max-width:200px;line-height:1.4">${r.trabajo||'—'}</td>
      <td><span class="badge badge-teal">${r.fase||'—'}</span></td>
      <td style="color:var(--muted);font-size:12px">${r.centro||'—'}</td>
      <td><button class="del-btn" onclick="confirmDelete('${r._key}')" title="Eliminar">🗑</button></td>
    </tr>`;
  }).join('');
}

function updateStats(rows) {
  const totalH = rows.reduce((s,r)=>s+diffH(r.entrada,r.salida),0);
  const tecnicos = new Set(rows.map(r=>r.empleado).filter(Boolean)).size;
  const clientes = new Set(rows.map(r=>r.cliente).filter(Boolean)).size;
  document.getElementById('sRegistros').textContent = rows.length;
  document.getElementById('sHoras').textContent = totalH.toFixed(1)+'h';
  document.getElementById('sTecnicos').textContent = tecnicos;
  document.getElementById('sClientes').textContent = clientes;
}

function confirmDelete(key) {
  if(confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')) {
    if(window.deleteFromFirebase) window.deleteFromFirebase(key);
    showToast('Registro eliminado');
  }
}

function clearFilters() {
  document.getElementById('fMes').value = '';
  document.getElementById('fTecnico').value = '';
  document.getElementById('fCliente').value = '';
  document.getElementById('fBuscar').value = '';
  applyFilters();
}

function exportExcel() {
  const mes = document.getElementById('fMes').value;
  const tec = document.getElementById('fTecnico').value;
  const cli = document.getElementById('fCliente').value;
  const bus = document.getElementById('fBuscar').value.toLowerCase();

  let rows = window.allRecords.filter(r => {
    if(mes) { const d=new Date((r.fecha||'')+'T12:00:00'); if(MESES[d.getMonth()]!==mes) return false; }
    if(tec && r.empleado!==tec) return false;
    if(cli && r.cliente!==cli) return false;
    if(bus) { const h=[r.empleado,r.cliente,r.trabajo,r.fase,r.centro].join(' ').toLowerCase(); if(!h.includes(bus)) return false; }
    return true;
  });

  const data = rows.map(r => {
    const d = new Date((r.fecha||'')+'T12:00:00');
    return {
      'Fecha': isNaN(d) ? r.fecha||'' : `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`,
      'Día': isNaN(d) ? '' : DIAS[d.getDay()],
      'Técnico': r.empleado||'',
      'Entrada': r.entrada||'',
      'Salida': r.salida||'',
      'Horas': diffH(r.entrada,r.salida).toFixed(1),
      'Cliente': r.cliente||'',
      'Trabajo realizado': r.trabajo||'',
      'Fase': r.fase||'',
      'Centro de Costos': r.centro||''
    };
  });

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Registros');
  const nombre = `Beirute_Horas_${mes||'Todo'}.xlsx`;
  XLSX.writeFile(wb, nombre);
  showToast('Excel exportado ✓');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 2500);
}
</script>
</body>
</html>
