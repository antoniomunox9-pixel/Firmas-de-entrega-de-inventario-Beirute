<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beirute — Cuadro de Control</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --teal: #2BBFB3;
  --teal-dark: #1a9990;
  --teal-light: #e0f7f6;
  --black: #111214;
  --dark: #1a1d20;
  --mid: #2a2e33;
  --steel: #3c4249;
  --border: #2e3238;
  --border-light: #e2e6ea;
  --text-primary: #f0f2f4;
  --text-secondary: #8c9099;
  --text-muted: #5a6070;
  --white: #ffffff;
  --bg-card: #1e2126;
  --bg-input: #252930;
  --danger: #e05252;
  --success: #2BBFB3;
}

body {
  font-family: 'Barlow', sans-serif;
  background: var(--black);
  color: var(--text-primary);
  min-height: 100vh;
  font-size: 14px;
}

/* HEADER */
.app-header {
  background: var(--dark);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-logo {
  height: 40px;
  width: auto;
  filter: brightness(0) invert(1);
  opacity: 0.95;
}

.brand-divider {
  width: 1px;
  height: 28px;
  background: var(--border);
}

.brand-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* MONTH NAV */
.month-nav {
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--mid);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.month-nav button {
  background: none;
  border: none;
  color: var(--text-secondary);
  width: 34px;
  height: 34px;
  cursor: pointer;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.month-nav button:hover { background: var(--steel); color: var(--white); }
.month-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-primary);
  min-width: 140px;
  text-align: center;
  padding: 0 4px;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  height: 34px;
  line-height: 34px;
}

/* ICON BUTTONS */
.icon-btn {
  background: var(--mid);
  border: 1px solid var(--border);
  border-radius: 6px;
  width: 34px;
  height: 34px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  font-size: 16px;
  position: relative;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.icon-btn:hover {
  background: var(--steel);
  color: var(--teal);
  border-color: var(--teal);
}
.icon-btn .tip {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--dark);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 11px;
  white-space: nowrap;
  color: var(--text-primary);
  display: none;
  pointer-events: none;
  font-family: 'Barlow', sans-serif;
}
.icon-btn:hover .tip { display: block; }

/* MAIN LAYOUT */
.main {
  padding: 2rem;
  max-width: 1400px;
  margin: 0 auto;
}

/* STATS GRID */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 1.5rem;
}
@media (max-width: 768px) { .stats { grid-template-columns: repeat(2, 1fr); } }

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.1rem 1.25rem;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--teal);
}
.stat-icon {
  font-size: 18px;
  color: var(--teal);
  margin-bottom: 8px;
  opacity: 0.8;
}
.stat-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.stat-value {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--white);
  line-height: 1;
}

/* TABLE CARD */
.table-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  background: var(--dark);
}

.table-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-primary);
}

.add-btn {
  background: var(--teal);
  color: var(--black);
  border: none;
  border-radius: 6px;
  padding: 7px 16px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Barlow', sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 0.02em;
  transition: background 0.15s;
}
.add-btn:hover { background: var(--teal-dark); }

.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead th {
  text-align: left;
  padding: 10px 14px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  background: var(--dark);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

tbody td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text-primary);
  vertical-align: middle;
}

tbody tr:last-child td { border-bottom: none; }

tbody tr:hover td {
  background: rgba(43, 191, 179, 0.04);
}

/* BADGES */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: capitalize;
  font-family: 'Barlow Condensed', sans-serif;
}
.badge-ini { background: rgba(255, 160, 60, 0.15); color: #ffa03c; border: 1px solid rgba(255,160,60,0.25); }
.badge-mid { background: rgba(43, 191, 179, 0.12); color: var(--teal); border: 1px solid rgba(43,191,179,0.25); }
.badge-fin { background: rgba(80, 200, 120, 0.12); color: #50c878; border: 1px solid rgba(80,200,120,0.25); }

/* TIME DISPLAY */
.time-cell { white-space: nowrap; }
.time-val { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 500; }
.time-hours { font-size: 10px; color: var(--teal); margin-top: 1px; letter-spacing: 0.05em; }

/* EMPLOYEE / CLIENT */
.name-cell { font-weight: 500; }
.work-cell { color: var(--text-secondary); max-width: 220px; line-height: 1.4; }

/* DELETE */
.del-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 15px;
  padding: 4px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  transition: color 0.15s, background 0.15s;
}
.del-btn:hover { color: var(--danger); background: rgba(224,82,82,0.1); }

/* EMPTY */
.empty {
  text-align: center;
  padding: 3rem;
  color: var(--text-muted);
  font-size: 14px;
}
.empty i { font-size: 32px; margin-bottom: 8px; display: block; opacity: 0.4; }

/* MODAL */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  backdrop-filter: blur(3px);
}
.modal {
  background: var(--dark);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.75rem;
  width: 380px;
  max-width: 95vw;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--white);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-title i { color: var(--teal); }
.form-group { margin-bottom: 12px; }
.form-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 5px;
}
.form-input, .form-textarea {
  width: 100%;
  padding: 9px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: 'Barlow', sans-serif;
  color: var(--text-primary);
  transition: border-color 0.15s;
  outline: none;
}
.form-input:focus, .form-textarea:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(43,191,179,0.12);
}
.form-textarea { resize: vertical; min-height: 72px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
}
.btn-cancel {
  background: var(--mid);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: 6px;
  padding: 8px 18px;
  font-size: 13px;
  font-family: 'Barlow', sans-serif;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-cancel:hover { background: var(--steel); }
.btn-save {
  background: var(--teal);
  border: none;
  color: var(--black);
  border-radius: 6px;
  padding: 8px 20px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Barlow', sans-serif;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-save:hover { background: var(--teal-dark); }

/* TOAST */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--dark);
  border: 1px solid var(--teal);
  border-radius: 6px;
  padding: 10px 22px;
  font-size: 13px;
  color: var(--teal);
  z-index: 1000;
  display: none;
  font-weight: 500;
  letter-spacing: 0.02em;
}

/* FOOTER */
.app-footer {
  text-align: center;
  padding: 1.5rem 2rem;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 2rem;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--dark); }
::-webkit-scrollbar-thumb { background: var(--steel); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--teal); }
</style>
</head>

<script>
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let now = new Date(), curY = now.getFullYear(), curM = now.getMonth();

let records = [];
function save() { /* guardado en Firebase */ }
function changeMonth(d) { curM += d; if(curM > 11) { curM = 0; curY++; } if(curM < 0) { curM = 11; curY--; } render(); }
function parseTime(t) { const [h,m] = t.split(':').map(Number); return h * 60 + m; }
function diffH(a, b) { if(!a || !b) return 0; return Math.max(0, (parseTime(b) - parseTime(a)) / 60); }
function weekOf(dStr) { const d = new Date(dStr + 'T12:00:00'); const day = d.getDate(); if(day <= 7) return 'ini'; if(day <= 21) return 'mid'; return 'fin'; }
function getRows() {
  return records.filter(r => {
    const d = new Date(r.fecha + 'T12:00:00');
    return d.getFullYear() === curY && d.getMonth() === curM;
  }).sort((a,b) => a.fecha.localeCompare(b.fecha));
}

const STAT_ICONS = ['ti-clipboard-list','ti-clock-hour4','ti-users','ti-building-store'];

function render() {
  document.getElementById('monthLabel').textContent = MESES[curM] + ' ' + curY;
  const rows = getRows();
  const totalH = rows.reduce((s, r) => s + diffH(r.entrada, r.salida), 0);
  const empleados = new Set(rows.map(r => r.empleado).filter(Boolean)).size;
  const clientes = new Set(rows.map(r => r.cliente).filter(Boolean)).size;
  
  const statsData = [
    { label: 'Registros', value: rows.length, icon: STAT_ICONS[0] },
    { label: 'Horas totales', value: totalH.toFixed(1) + 'h', icon: STAT_ICONS[1] },
    { label: 'Técnicos activos', value: empleados, icon: STAT_ICONS[2] },
    { label: 'Clientes atendidos', value: clientes, icon: STAT_ICONS[3] },
  ];
  document.getElementById('stats').innerHTML = statsData.map(s => `
    <div class="stat-card">
      <div class="stat-icon"><i class="ti ${s.icon}"></i></div>
      <div class="stat-label">${s.label}</div>
      <div class="stat-value">${s.value}</div>
    </div>
  `).join('');

  const tbody = document.getElementById('tbody');
  if(!rows.length) {
    tbody.innerHTML = `<tr><td colspan="10" class="empty"><i class="ti ti-calendar-off"></i>Sin registros en ${MESES[curM]} ${curY}</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const d = new Date(r.fecha + 'T12:00:00');
    const dia = DIAS[d.getDay()];
    const w = weekOf(r.fecha);
    const horas = diffH(r.entrada, r.salida);
    const idx = records.indexOf(r);
    return `<tr>
      <td style="white-space:nowrap;font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--text-secondary)">${d.getDate().toString().padStart(2,'0')}/${(curM+1).toString().padStart(2,'0')}/${curY}</td>
      <td><span class="badge badge-${w}">${dia}</span></td>
      <td class="name-cell">${r.empleado || '—'}</td>
      <td class="time-cell">
        <div class="time-val">${r.entrada || '—'}</div>
      </td>
      <td class="time-cell">
        <div class="time-val">${r.salida || '—'}</div>
        ${horas > 0 ? `<div class="time-hours">${horas.toFixed(1)}h</div>` : ''}
      </td>
      <td style="font-weight:500">${r.cliente || '—'}</td>
      <td class="work-cell">${r.trabajo || '—'}</td>
      <td style="white-space:nowrap;color:var(--teal);font-family:'Barlow Condensed',sans-serif;font-size:13px;">${r.fase || '—'}</td>
      <td style="white-space:nowrap;color:var(--text-secondary);font-family:'Barlow Condensed',sans-serif;font-size:13px;">${r.centro || '—'}</td>
      <td><button class="del-btn" onclick="delRecord('${r._key}')" title="Eliminar"><i class="ti ti-trash"></i></button></td>
    </tr>`;
  }).join('');
}

function delRecord(key) {
  if(confirm('¿Eliminar este registro?')) {
    if(window.deleteFromFirebase) window.deleteFromFirebase(key);
  }
}

function openModal() {
  const today = new Date();
  const y = today.getFullYear(), m = String(curM+1).padStart(2,'0'), d = String(today.getDate()).padStart(2,'0');
  document.getElementById('fFecha').value = `${y}-${m}-${d}`;
  document.getElementById('fEmpleado').value = '';
  document.getElementById('fEntrada').value = '07:00';
  document.getElementById('fSalida').value = '17:00';
  document.getElementById('fCliente').value = '';
  document.getElementById('fTrabajo').value = '';
  document.getElementById('fFase').value = '';
  document.getElementById('fCentro').value = '';
  document.getElementById('modalBg').style.display = 'flex';
}
function closeModal() { document.getElementById('modalBg').style.display = 'none'; }
function saveEntry() {
  const fecha = document.getElementById('fFecha').value;
  if(!fecha) { alert('Selecciona una fecha'); return; }
  const record = {
    fecha,
    empleado: document.getElementById('fEmpleado').value,
    entrada: document.getElementById('fEntrada').value,
    salida: document.getElementById('fSalida').value,
    cliente: document.getElementById('fCliente').value,
    trabajo: document.getElementById('fTrabajo').value,
    fase: document.getElementById('fFase').value,
    centro: document.getElementById('fCentro').value
  };
  if(window.saveToFirebase) window.saveToFirebase(record);
  closeModal();
  const d = new Date(fecha + 'T12:00:00'); curY = d.getFullYear(); curM = d.getMonth();
}

function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function exportCSV() {
  const rows = getRows();
  const mes = MESES[curM] + ' ' + curY;

  // Build data array: header row + data rows
  const headers = ['Fecha','Día','Técnico / Empleado','Hora Entrada','Hora Salida','Horas','Cliente','Trabajo Realizado','Fase','Centro de Costos'];
  const data = [headers];
  rows.forEach(r => {
    const d = new Date(r.fecha + 'T12:00:00');
    const dia = DIAS[d.getDay()];
    const h = parseFloat(diffH(r.entrada, r.salida).toFixed(2));
    data.push([
      `${d.getDate().toString().padStart(2,'0')}/${(curM+1).toString().padStart(2,'0')}/${curY}`,
      dia,
      r.empleado || '',
      r.entrada || '',
      r.salida || '',
      h,
      r.cliente || '',
      r.trabajo || '',
      r.fase || '',
      r.centro || ''
    ]);
  });

  // Use SheetJS to create a proper .xlsx
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  script.onload = () => {
    const ws = XLSX.utils.aoa_to_sheet(data);

    // Column widths
    ws['!cols'] = [
      {wch:12}, // Fecha
      {wch:12}, // Día
      {wch:22}, // Técnico
      {wch:13}, // Hora Entrada
      {wch:13}, // Hora Salida
      {wch:8},  // Horas
      {wch:22}, // Cliente
      {wch:35}, // Trabajo
      {wch:16}, // Fase
      {wch:18}, // Centro de Costos
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, mes.replace(/\s/g,'_'));
    XLSX.writeFile(wb, `beirute_control_${MESES[curM]}_${curY}.xlsx`);
    showToast('✓ Excel descargado');
  };
  script.onerror = () => {
    // Fallback to CSV if SheetJS fails to load
    const csvRows = [headers.join(','), ...data.slice(1).map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))];
    const blob = new Blob(['\uFEFF' + csvRows.join('\n')], {type: 'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `beirute_control_${MESES[curM]}_${curY}.csv`; a.click();
    URL.revokeObjectURL(url);
    showToast('✓ CSV descargado');
  };
  // Only inject if not already loaded
  if (typeof XLSX !== 'undefined') {
    script.onload();
  } else {
    document.head.appendChild(script);
  }
}

function copyLink() {
  const rows = getRows();
  const mes = MESES[curM] + ' ' + curY;
  const totalH = rows.reduce((s, r) => s + diffH(r.entrada, r.salida), 0);
  let txt = `📋 Refrigeración Industrial Beirute — ${mes}\n`;
  txt += `Registros: ${rows.length} | Horas: ${totalH.toFixed(1)}h\n\n`;
  txt += 'Fecha\t\tTécnico\t\tEntrada\tSalida\tCliente\t\tTrabajo\t\tFase\tCentro\n';
  txt += '─'.repeat(100) + '\n';
  rows.forEach(r => {
    const d = new Date(r.fecha + 'T12:00:00');
    txt += `${d.getDate()}/${curM+1}/${curY}\t${r.empleado||'—'}\t${r.entrada||'—'}\t${r.salida||'—'}\t${r.cliente||'—'}\t${r.trabajo||'—'}\t${r.fase||'—'}\t${r.centro||'—'}\n`;
  });
  navigator.clipboard.writeText(txt).then(() => showToast('✓ Tabla copiada al portapapeles')).catch(() => showToast('No se pudo copiar'));
}
